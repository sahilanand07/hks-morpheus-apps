# ==============================================================================
# Hello World - Morpheus Kubernetes spec (one self-contained file)
#
#   ConfigMap   hello-world-content   nginx server block + the page (index.html)
#   Deployment  hello-world           2 replicas, spread across workers, non-root
#   Service     hello-world           NodePort 30082
#
# HPE Morpheus: Library > Blueprints > App Blueprints > Type Kubernetes >
#   CONFIG TYPE "Git Repository", BRANCH OR TAG main, SPEC PATH apps/hello-world,
#   CONFIG hello-world.yaml. The namespace is chosen when you deploy the App,
#   so no object here sets metadata.namespace.
#
# kubectl:  kubectl apply -k .            (repo root, namespace hpe-apps)
# Test:     curl http://<any-node-ip>:30082/
#
# NodePort 30080 is left free for the hks-hybrid-kit validation app (namespace hello).
# To publish a change: edit the page, bump app_version in index.html AND the
# hks-morpheus-apps/version annotation below (CI checks they match), push.
# No dollar signs and no Morpheus template tags anywhere in this file (not even in
# comments): Morpheus can run specs through its variable templating.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world-content
  labels:
    app.kubernetes.io/name: hello-world
    app.kubernetes.io/part-of: hks-morpheus-apps
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      server_tokens off;
      root /usr/share/nginx/html;
      index index.html;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location / {
        ssi on;
        add_header Cache-Control "no-store" always;
      }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="app" content="hello-world">
      <title>Hello World &middot; HKS</title>
      <style>
        :root {
          --accent: #7630ea;
          --green: #01a982;
          --bg: #f4f6f8;
          --card: #ffffff;
          --ink: #16202a;
          --muted: #5f6f7c;
          --line: #e2e7ec;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px;
          background: var(--bg);
          color: var(--ink);
          font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .card {
          width: 100%;
          max-width: 560px;
          background: var(--card);
          border: 1px solid var(--line);
          border-top: 6px solid var(--accent);
          border-radius: 14px;
          padding: 40px 40px 32px;
          box-shadow: 0 12px 32px rgba(22, 32, 42, 0.08);
        }
        .tag { margin: 0; color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: 1.6px; text-transform: uppercase; }
        h1 { margin: 10px 0 8px; font-size: clamp(36px, 7vw, 56px); line-height: 1.05; }
        .sub { margin: 0 0 28px; color: var(--muted); font-size: 17px; line-height: 1.5; }
        dl { display: grid; grid-template-columns: max-content 1fr; gap: 10px 20px; margin: 0; padding-top: 22px; border-top: 1px solid var(--line); }
        dt { color: var(--muted); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; align-self: center; }
        dd { margin: 0; }
        code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; overflow-wrap: anywhere; }
        .ok { display: inline-flex; align-items: center; gap: 8px; margin-top: 26px; color: var(--muted); font-size: 14px; }
        .ok::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
      </style>
    </head>
    <body>
    <!--# set var="app_version" value="1.0.0" -->
    <!--# config timefmt="%d %b %Y, %H:%M:%S %Z" -->
      <main class="card">
        <p class="tag">HKS &middot; HPE Morpheus</p>
        <h1>Hello, World!</h1>
        <p class="sub">Deployed from Git by HPE Morpheus to the HKS cluster.</p>
        <dl>
          <dt>Pod</dt><dd><code id="pod"><!--# echo var="hostname" default="unknown" --></code></dd>
          <dt>Pod IP</dt><dd><code id="ip"><!--# echo var="server_addr" default="unknown" --></code></dd>
          <dt>Time</dt><dd><code><!--# echo var="date_local" --></code></dd>
          <dt>Version</dt><dd><code id="version"><!--# echo var="app_version" --></code></dd>
        </dl>
        <div class="ok">Served on NodePort 30082</div>
      </main>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  labels:
    app.kubernetes.io/name: hello-world
    app.kubernetes.io/part-of: hks-morpheus-apps
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world
        app.kubernetes.io/part-of: hks-morpheus-apps
      annotations:
        # Bump together with app_version in index.html. A new value changes the
        # pod template, so Kubernetes rolls the pods and the change is live at once.
        hks-morpheus-apps/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hello-world
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Air-gapped: mirror this image to your registry and change the line.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: hello-world-content
            items:
              - key: default.conf
                path: default.conf
        - name: site
          configMap:
            name: hello-world-content
            items:
              - key: index.html
                path: index.html
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  labels:
    app.kubernetes.io/name: hello-world
    app.kubernetes.io/part-of: hks-morpheus-apps
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: hello-world
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30082
