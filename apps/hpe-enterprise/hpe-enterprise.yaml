# ------------------------------------------------------------------------------
# HPE Enterprise team page - Morpheus Kubernetes spec (one self-contained file)
#
#   ConfigMap   hpe-enterprise-content   nginx server block + the page (index.html)
#   Deployment  hpe-enterprise           2 replicas, spread across workers, non-root
#   Service     hpe-enterprise           NodePort 30081
#
# HPE Morpheus: Library > Blueprints > App Blueprints > Type Kubernetes >
#   CONFIG TYPE "Git Repository", BRANCH OR TAG main, SPEC PATH apps/hpe-enterprise,
#   CONFIG hpe-enterprise.yaml. The namespace is chosen when you deploy the App,
#   so no object here sets metadata.namespace.
#
# kubectl:  kubectl apply -k .            (repo root, namespace hpe-apps)
# Test:     curl http://<any-node-ip>:30081/
#
# To publish a change: edit the page, bump app_version in index.html AND the
# hks-morpheus-apps/version annotation below (CI checks they match), push.
# No dollar signs and no Morpheus template tags anywhere in this file (not even in
# comments): Morpheus can run specs through its variable templating.
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: hpe-enterprise-content
  labels:
    app.kubernetes.io/name: hpe-enterprise
    app.kubernetes.io/part-of: hks-morpheus-apps
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      server_tokens off;
      root /usr/share/nginx/html;
      index index.html;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location / {
        ssi on;
        add_header Cache-Control "no-store" always;
      }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="app" content="hpe-enterprise">
      <title>HPE Enterprise Team</title>
      <style>
        :root {
          --green: #01a982;
          --ink: #0e1a22;
          --panel: #15232d;
          --line: #253642;
          --text: #eaf0f3;
          --soft: #b7c5cd;
          --muted: #8597a3;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          background: var(--ink);
          color: var(--text);
          font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 18px 40px;
          border-bottom: 1px solid var(--line);
        }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 17px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(1, 169, 130, 0.18); }
        .badge {
          font-size: 12px;
          letter-spacing: 1.2px;
          text-transform: uppercase;
          color: var(--green);
          border: 1px solid var(--green);
          border-radius: 999px;
          padding: 4px 12px;
        }
        main { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 72px 40px 48px; }
        .eyebrow { margin: 0; color: var(--green); font-weight: 600; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
        h1 { margin: 14px 0 18px; font-size: clamp(32px, 5vw, 54px); line-height: 1.1; font-weight: 700; max-width: 900px; }
        .accent { color: var(--green); }
        .lead { margin: 0; max-width: 740px; color: var(--soft); font-size: 18px; line-height: 1.6; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 48px; }
        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
        .k { color: var(--muted); font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; }
        .v { display: block; margin-top: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; overflow-wrap: anywhere; }
        h2 { margin: 52px 0 16px; font-size: 15px; font-weight: 600; color: var(--soft); letter-spacing: 0.4px; }
        .flow { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin: 0; padding: 0; }
        .flow li { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: 8px; background: var(--panel); flex: 1 1 190px; }
        .flow strong { font-size: 15px; }
        .flow span { color: var(--muted); font-size: 13px; }
        .hint { margin-top: 28px; color: var(--muted); font-size: 14px; }
        footer {
          display: flex;
          flex-wrap: wrap;
          justify-content: space-between;
          gap: 8px;
          padding: 18px 40px;
          border-top: 1px solid var(--line);
          color: var(--muted);
          font-size: 13px;
        }
        @media (max-width: 640px) {
          .top, footer { padding-left: 20px; padding-right: 20px; }
          main { padding: 48px 20px 32px; }
        }
      </style>
    </head>
    <body>
    <!--# set var="app_version" value="1.0.0" -->
    <!--# config timefmt="%d %b %Y, %H:%M:%S %Z" -->
      <header class="top">
        <div class="brand"><span class="dot" aria-hidden="true"></span>HPE Enterprise Team</div>
        <span class="badge">Internal</span>
      </header>
      <main>
        <p class="eyebrow">Team landing page</p>
        <h1>This page is for the <span class="accent">HPE Enterprise team</span>.</h1>
        <p class="lead">The page lives in Git, HPE Morpheus deploys it, and an HKS (HPE Kubernetes Service) cluster on HPE HVM serves it. Change it in Git, roll it out again, and Kubernetes replaces the pods one at a time while the page stays up.</p>

        <section class="grid" aria-label="Runtime details">
          <div class="card"><div class="k">Served by pod</div><code class="v" id="pod"><!--# echo var="hostname" default="unknown" --></code></div>
          <div class="card"><div class="k">Pod IP</div><code class="v" id="ip"><!--# echo var="server_addr" default="unknown" --></code></div>
          <div class="card"><div class="k">Served at</div><code class="v"><!--# echo var="date_local" --></code></div>
          <div class="card"><div class="k">Page version</div><code class="v" id="version"><!--# echo var="app_version" --></code></div>
        </section>

        <h2>How this page reaches you</h2>
        <ol class="flow">
          <li><strong>1 · GitHub</strong><span>apps/hpe-enterprise</span></li>
          <li><strong>2 · HPE Morpheus</strong><span>Kubernetes App Blueprint</span></li>
          <li><strong>3 · HKS cluster</strong><span>2 replicas across workers</span></li>
          <li><strong>4 · NodePort 30081</strong><span>on any node IP</span></li>
        </ol>

        <p class="hint">Refresh the page: the pod name changes as the Service spreads requests across the replicas.</p>
      </main>
      <footer>
        <span>HPE Enterprise team &middot; internal use</span>
        <span>hks-morpheus-apps &middot; v<!--# echo var="app_version" --></span>
      </footer>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpe-enterprise
  labels:
    app.kubernetes.io/name: hpe-enterprise
    app.kubernetes.io/part-of: hks-morpheus-apps
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hpe-enterprise
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hpe-enterprise
        app.kubernetes.io/part-of: hks-morpheus-apps
      annotations:
        # Bump together with app_version in index.html. A new value changes the
        # pod template, so Kubernetes rolls the pods and the change is live at once.
        hks-morpheus-apps/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hpe-enterprise
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Air-gapped: mirror this image to your registry and change the line.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: hpe-enterprise-content
            items:
              - key: default.conf
                path: default.conf
        - name: site
          configMap:
            name: hpe-enterprise-content
            items:
              - key: index.html
                path: index.html
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hpe-enterprise
  labels:
    app.kubernetes.io/name: hpe-enterprise
    app.kubernetes.io/part-of: hks-morpheus-apps
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: hpe-enterprise
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
