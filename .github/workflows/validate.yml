# Runs on every push and pull request: the same checks as `bash scripts/validate.sh`.
# A red X here means Morpheus would deploy something broken - fix before redeploying.
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML and kubeconform
        run: |
          python -m pip install --quiet pyyaml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Pull the app image
        run: docker pull -q nginxinc/nginx-unprivileged:1.27-alpine

      - name: Validate specs, schemas and pages
        run: bash scripts/validate.sh
