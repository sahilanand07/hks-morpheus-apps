# Builds the model server image (Ollama, CPU only, models built in - about 2.5 GB)
# from images/slm/ and pushes it to ghcr.io/<owner>/hks-slm:<images/slm/VERSION>.
# The package takes the repository's visibility (public repo = public image, so the
# cluster pulls it without credentials).
#
# A VERSION that is already in the registry is never overwritten: the build is
# then pushed only as sha-<commit>. Bump images/slm/VERSION (and the tag in
# apps/doc-assistant/doc-assistant.yaml) to publish a new version.
name: image-slm

on:
  push:
    paths:
      - "images/slm/**"
      - ".github/workflows/image-slm.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space for the models
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Image name and version
        id: v
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="$(tr -d '[:space:]' < images/slm/VERSION)"
          image="ghcr.io/$owner/hks-slm"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this version already published?
        id: exists
        run: |
          if docker buildx imagetools inspect "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "tags=${{ steps.v.outputs.image }}:sha-${{ steps.v.outputs.short }}" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }} already exists and is kept. Bump images/slm/VERSION to publish this build under a new version."
          else
            echo "tags=${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }},${{ steps.v.outputs.image }}:sha-${{ steps.v.outputs.short }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: images/slm/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.exists.outputs.tags }}

      - name: Summary
        run: |
          {
            echo "### hks-slm"
            echo
            echo "Pushed: ${{ steps.exists.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
